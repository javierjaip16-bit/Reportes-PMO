<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#042a54"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#00bcd4" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Interconexiones de red (Enlaces Troncales / Red IP / HUBs) -->
  <line x1="32" y1="16" x2="15" y2="46" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="49" y2="46" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="15" y1="46" x2="49" y2="46" stroke="#00bcd4" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Núcleo central PMO -->
  <circle cx="32" cy="35" r="5" fill="#ffffff"/>
  <line x1="32" y1="16" x2="32" y2="35" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="15" y1="46" x2="32" y2="35" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="49" y1="46" x2="32" y2="35" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2"/>
  
  <!-- Nodos de Red de Telecomunicaciones -->
  <circle cx="32" cy="16" r="8" fill="url(#cyanGrad)"/>
  <circle cx="32" cy="16" r="3.5" fill="#ffffff"/>
  
  <circle cx="15" cy="46" r="7.5" fill="url(#cyanGrad)"/>
  <circle cx="15" cy="46" r="3" fill="#ffffff"/>
  
  <circle cx="49" cy="46" r="7.5" fill="url(#cyanGrad)"/>
  <circle cx="49" cy="46" r="3" fill="#ffffff"/>
</svg>
